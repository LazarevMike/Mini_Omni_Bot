<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniBots Mini" />
    <title>OmniBots Mini</title>
    <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="stylesheet" href="/static/style.css?v=1" />
  </head>
  <body>
    <main id="app" class="app" data-state="connecting">
      <header class="top">
        <h1>OmniBots Mini</h1>
        <div class="chips">
          <span id="serverChip" class="chip" data-level="warn" title="Connection to the robot">
            <i class="dot"></i><span>Robot</span><b id="latency" class="latency"></b>
          </span>
          <span id="wifiChip" class="chip" data-level="warn" title="The robot's WiFi signal">
            <i class="dot"></i><span>WiFi</span><b id="rssi" class="latency"></b>
          </span>
        </div>
        <p id="statusText" class="status-text" aria-live="polite">Connecting…</p>
      </header>

      <div id="notice" class="notice" role="alert" hidden></div>

      <section class="card pad-card" aria-label="Drive">
        <div class="readouts">
          <div class="readout">
            <span class="label">Direction</span>
            <span class="value">
              <svg id="dirArrow" class="dir-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.5 19 11h-4.6v10.5H9.6V11H5z" />
              </svg>
              <span id="angleValue">—</span>
            </span>
          </div>
          <div class="readout align-end">
            <span class="label">Speed</span>
            <span class="value"><span id="speedValue">0</span><small>%</small></span>
          </div>
        </div>

        <div class="pad-area">
          <div id="joystick" class="pad" role="application" aria-label="Drive joystick" aria-disabled="true">
            <svg class="pad-face" viewBox="-100 -100 200 200" aria-hidden="true">
              <defs>
                <linearGradient id="speedGrad" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
                  <stop offset="0%" class="grad-a" />
                  <stop offset="100%" class="grad-b" />
                </linearGradient>
              </defs>
              <circle class="ring-track" r="95" />
              <circle id="speedRing" class="ring-speed" r="95" transform="rotate(-90)" />
              <g id="ticks" class="ticks"></g>
              <circle class="guide" r="62" />
              <circle class="guide faint" r="31" />
              <g class="chevrons">
                <path d="M-6 -70 0 -77 6 -70" />
                <path d="M70 -6 77 0 70 6" />
                <path d="M-6 70 0 77 6 70" />
                <path d="M-70 -6 -77 0 -70 6" />
              </g>
              <line id="vecLine" class="vec-line" x1="0" y1="0" x2="0" y2="0" />
              <g id="dirMarker" class="dir-marker"><circle cx="0" cy="-95" r="5.5" /></g>
            </svg>
            <div id="stick" class="stick"></div>
            <div id="padLock" class="pad-lock">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M7 10V7.5a5 5 0 0 1 10 0V10h.5A1.5 1.5 0 0 1 19 11.5v8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-8A1.5 1.5 0 0 1 6.5 10zm2 0h6V7.5a3 3 0 0 0-6 0z"
                />
              </svg>
              <span id="padLockText">Turn on Joystick mode</span>
            </div>
          </div>
        </div>

        <p class="hint">
          <span class="hint-touch">Drag the knob to drive</span>
          <span class="hint-desk">Drag the knob, or use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows · <kbd>Q</kbd><kbd>E</kbd> turn · <kbd>Space</kbd> stops</span>
        </p>
      </section>

      <section class="card controls" aria-label="Driving options">
        <div class="control">
          <div class="control-head">
            <span class="label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.4 5H2l3.5-4.5L9 9H6.8A6 6 0 1 0 12 6z" /></svg>
              Spin
            </span>
            <span id="spinCaption" class="caption">Off</span>
          </div>
          <div id="spinSeg" class="segmented" role="radiogroup" aria-label="Spin">
            <span class="seg-thumb"></span>
            <button type="button" role="radio" data-value="1" title="Keep turning left (counter-clockwise)">Left</button>
            <button type="button" role="radio" data-value="0">Off</button>
            <button type="button" role="radio" data-value="-1" title="Keep turning right (clockwise)">Right</button>
          </div>
        </div>

        <div class="control">
          <div class="control-head">
            <span class="label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a10 10 0 0 1 10 10 1 1 0 0 1-2 0 8 8 0 0 0-16 0 1 1 0 0 1-2 0A10 10 0 0 1 12 4zm4.6 4.4a1 1 0 0 1 .1 1.3l-3.2 4.6a2 2 0 1 1-2.6-2.1l4.4-3.8a1 1 0 0 1 1.3 0z" /></svg>
              Speed limit
            </span>
            <span class="caption">Top speed at full stick</span>
          </div>
          <div class="slider-row">
            <input id="limitSlider" type="range" min="10" max="100" step="5" value="50" aria-label="Speed limit" />
            <span id="limitValue" class="slider-value">50%</span>
          </div>
        </div>
      </section>

      <footer class="actions">
        <button id="driveBtn" class="drive-btn" type="button" role="switch" aria-checked="false" aria-label="Joystick mode">
          <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
          <span class="drive-text" aria-hidden="true">
            <b>Joystick<span class="wide-only"> mode</span></b>
            <small id="driveSub">Off</small>
          </span>
        </button>
        <button id="stopBtn" class="stop-btn" type="button" aria-label="Emergency stop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 2h7.4L22 8.3v7.4L15.7 22H8.3L2 15.7V8.3z" /></svg>
          <span>Stop</span>
        </button>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    </main>

    <script src="/static/app.js?v=1"></script>
  </body>
</html>
