; =====================================================================================
;  PlatformIO settings for the full program of Mini Omni Bot (firmware/OmniBots_Mini)
; =====================================================================================
;
;   pio run -t upload        build the program and upload it to the robot (Romeo ESP32-S3)
;   pio device monitor       open the Serial Monitor to type commands (or click the
;                            Serial Monitor button, the plug, in VS Code's bottom bar)
;
;  For another board, select its section first. In VS Code: click the environment name in
;  the bottom bar (it shows Default) and choose env:<section>; Upload and the Serial Monitor
;  then use it. In a terminal, add -e <section>, for example:
;   pio run -e arduino_mega -t upload
;   pio device monitor -e arduino_mega
;  Sections: romeo, esp32_devkit, esp32s3_devkit, arduino_mega, uno_r4_minima, uno_r4_wifi,
;  stm32_nucleo and my_own (your own pins, in config.h). The section selects the board: the
;  board lines in config.h are skipped. docs/08_Other_Boards.md gives the wiring.
;
;  To use the Arduino IDE instead, open firmware/OmniBots_Mini/OmniBots_Mini.ino and select
;  the board in config.h. The driving page is already packed in (web_assets.h);
;  `python3 tools/embed_web.py` is needed only after a change in web/.
;
; =====================================================================================

[platformio]
src_dir = firmware/OmniBots_Mini
default_envs = romeo

; Settings every board shares
[env]
framework = arduino
; The Serial Monitor, set up to work like the Arduino IDE's: typed text is visible, and the
; whole line goes to the robot when Enter is pressed, with a New Line (\n) at the end.
; (send_on_enter holds typed text until Enter; direct passes the robot's text through as is.)
monitor_speed = 115200
monitor_filters = direct, send_on_enter
monitor_echo = yes
monitor_eol = LF
; (DTR and RTS: PlatformIO opens the port with both on, like the Arduino IDE. An ESP32 board
; reads "both on" as normal running, so opening the monitor does not leave it in download mode.)
; packs web/ into firmware/OmniBots_Mini/web_assets.h before every build
extra_scripts = pre:tools/embed_web.py
; read the #if lines when looking for libraries, so a build with the phone joystick off
; (-DREMOTE_CONTROL=0) does not compile the WiFi libraries at all
lib_ldf_mode = chain+

; DFRobot Romeo ESP32-S3 - the board of the robot as built
[env:romeo]
platform = espressif32@7.1.3
board = dfrobot_romeo_esp32s3
; the core's own log lines would reach the Serial Monitor unasked (the Arduino IDE's
; default "Core Debug Level: None" does the same)
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_ROMEO_ESP32S3

; A plain ESP32 DevKit plus separate motor drivers
[env:esp32_devkit]
platform = espressif32@7.1.3
board = esp32dev
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_ESP32_DEVKIT

; An ESP32-S3 DevKitC-1 (or a clone) plus separate motor drivers. Connect to its UART port.
; To use its USB port instead, add -DARDUINO_USB_CDC_ON_BOOT=1 to build_flags.
[env:esp32s3_devkit]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_ESP32S3_DEVKIT

; Arduino Mega 2560 plus separate motor drivers
[env:arduino_mega]
platform = atmelavr
board = megaatmega2560
build_flags = -DBOARD_ARDUINO_MEGA

; Arduino UNO R4 Minima, and UNO R4 WiFi, plus separate motor drivers (the same pins on both)
[env:uno_r4_minima]
platform = renesas-ra@1.9.0
board = uno_r4_minima
build_flags = -DBOARD_UNO_R4

[env:uno_r4_wifi]
platform = renesas-ra@1.9.0
board = uno_r4_wifi
build_flags = -DBOARD_UNO_R4

; STM32 Nucleo-F401RE plus separate motor drivers
[env:stm32_nucleo]
platform = ststm32
board = nucleo_f401re
build_flags = -DBOARD_STM32_NUCLEO

; Your own board: its pins are in config.h, under "Your own board's pins". The example pins
; there are for an ESP32-S3 DevKitC-1, which is therefore the board here. For another board,
; copy the platform and board lines from the closest section above (for example,
; renesas-ra@1.9.0 and uno_r4_minima).
[env:my_own]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_MY_OWN
